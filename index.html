  <script>
    // Apply saved theme/language before first paint to avoid a flash.
    (function () {
      try {
        var m = document.cookie.match(/(?:^|; )gf_theme=([^;]+)/);
        var t = m ? decodeURIComponent(m[1]) : null;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        var l = document.cookie.match(/(?:^|; )gf_lang=([^;]+)/);
        if (l) document.documentElement.lang = decodeURIComponent(l[1]);
      } catch (e) {}
    })();
