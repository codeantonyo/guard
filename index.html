<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guard Film — Premium Paint Protection Film and Car Wrap installation in Chișinău, Moldova. Protect your car with the best PPF films available." />
  <meta name="keywords" content="PPF Moldova, car wrap Chisinau, paint protection film, Guard Film, auto folie moldova" />
  <meta property="og:title" content="Guard Film — Make a Difference" />
  <meta property="og:description" content="Premium PPF & Car Wrap. Chișinău, Moldova." />
  <meta property="og:type" content="website" />
  <title>Guard Film — Make a Difference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #080808; overflow-x: hidden; }
    html[data-theme="light"] { background: #f3f4f1; }
    body { color: #fff; overflow-x: hidden; cursor: none; }
    html[data-theme="light"] body { color: #0b0d0c; }
    ::selection { background: rgba(29,185,84,0.3); color: #fff; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1DB954; border-radius: 2px; }
    /* Restore native cursor on touch devices */
    @media (pointer: coarse) {
      body { cursor: auto; }
      #cursor-dot, #cursor-ring { display: none !important; }
    }
  </style>
  <script>
    // Apply saved theme/language before first paint to avoid a flash.
    (function () {
      try {
        var m = document.cookie.match(/(?:^|; )gf_theme=([^;]+)/);
        var t = m ? decodeURIComponent(m[1]) : null;
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        var l = document.cookie.match(/(?:^|; )gf_lang=([^;]+)/);
        if (l) document.documentElement.lang = decodeURIComponent(l[1]);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
